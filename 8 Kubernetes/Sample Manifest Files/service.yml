apiVersion: v1
kind: Service

metadata:
  name: my-service
  namespace: nginx-ns

spec:
  # Selects Pods with label app=nginx
  # (this label must exist on the Pods created by the Deployment)
  selector:
    app: nginx

  ports:
    - protocol: TCP

      # Port on which the Service is exposed
      # Other Pods inside the cluster access the Service using this port
      port: 80

      # Port on the Pod container where the application is actually listening
      # Traffic received on Service port 80 is forwarded to this container port
      targetPort: 9376
