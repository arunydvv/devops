apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: mysql-hpa
  namespace: mysql

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mysql-dep

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
